<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NIRIKSHAK</title>
<style>
  body { width: 320px; margin: 0; padding: 12px; font: 13px "Segoe UI", Tahoma, sans-serif; color: #1d232b; background: #f2f2ee; }
  h1 { font-size: 13px; margin: 0 0 8px; letter-spacing: .08em; border-bottom: 2px solid #a6802a; padding-bottom: 4px; }
  input { width: 100%; box-sizing: border-box; padding: 5px 6px; border: 1px solid #aeb3aa; margin-bottom: 8px; font: inherit; }
  button { padding: 5px 10px; border: 1px solid #1f3b55; background: #24486a; color: #fff; cursor: pointer; font: inherit; }
  #out { margin-top: 10px; font-size: 12px; }
  .HIGH { color: #a3201b; font-weight: 700; }
  .MEDIUM { color: #8a5a00; font-weight: 700; }
  .LOW { color: #2f6b2f; font-weight: 700; }
  .linked { margin-top: 4px; font-weight: 600; color: #a3201b; }
  .cfg { margin-top: 10px; border-top: 1px solid #d2d4cc; padding-top: 6px; font-size: 11px; }
  .cfg summary { cursor: pointer; color: #47525e; }
  .cfg input { margin: 6px 0 4px; font-size: 11px; }
  .cfg button { padding: 3px 8px; font-size: 11px; background: #e8e9e4; color: #1d232b; border-color: #aeb3aa; }
  #srv-msg { margin-top: 4px; color: #2f6b2f; }
</style>
</head>
<body>
  <h1>NIRIKSHAK · LINK CHECK</h1>
  <input id="u" type="text" placeholder="https://...">
  <button id="go" type="button">Check address</button>
  <button id="full" type="button">Full check / report</button>
  <div id="out"></div>
  <details class="cfg">
    <summary>Server settings</summary>
    <input id="srv" type="url" placeholder="https://nirikshak-ten.vercel.app">
    <button id="save-srv" type="button">Save server</button>
    <div id="srv-msg"></div>
  </details>
  <script src="popup.js"></script>
</body>
</html>
